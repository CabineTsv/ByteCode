org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ABIs that get a native Luau build. Narrow this list for faster local builds,
# e.g. -Pbytecode.abis=arm64-v8a
bytecode.abis=arm64-v8a,armeabi-v7a,x86_64

# Set to true to skip the npm/esbuild step (only when editor/src/main/assets/editor/dist already exists).
bytecode.skipEditorBundle=false
